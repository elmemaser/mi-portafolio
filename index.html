<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi portafolio web</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      color: #eef4ff;
      background: #101827;
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      color: #65c8ff;
    }

    .proyecto {
      padding: 22px;
      margin-top: 24px;
      border: 1px solid #344762;
      border-radius: 14px;
      background: #19263a;
    }

    p {
      line-height: 1.6;
      color: #d0d9e8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mi portafolio web</h1>
    <p>Estoy aprendiendo a crear páginas web y aquí muestro algunos de mis proyectos.</p>

    <h2>Mis proyectos</h2>

    <section class="proyecto">
      <h2>Página de viajes Tyjuasrip</h2>
      <p>Proyecto familiar. Practiqué cómo organizar información de tours y diseñar tarjetas para una página web.</p>
    </section>
  </main>
</body>
</html>
